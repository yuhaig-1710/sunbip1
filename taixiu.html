<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbịp - Tài Xỉu Online VIP</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="casino-app">
    <header class="game-header">
      <div class="header-left">
        <button onclick="location.href='index.html'" style="background:#334155; border:none; color:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:bold; margin-right:8px;">⬅ Sảnh</button>
        <div class="logo">🎲 SUN<span>BỊP</span></div>
        <div class="session-badge" style="margin-left: 6px;">PHIÊN #<span id="session-num">1001</span></div>
      </div>
      <div class="header-right">
        <div class="balance-card">
          <span class="coin-icon">💰</span>
          <span id="balance">0</span>
          <button class="btn-add-money" id="btn-open-deposit" title="Nạp tiền">+</button>
        </div>
      </div>
    </header>

    <main class="casino-board">
      <div class="timer-container">
        <div class="timer-ring"><span id="timer-sec">15</span></div>
        <div class="timer-status" id="timer-state">ĐANG ĐẶT CƯỢC</div>
      </div>

      <div class="table-center">
        <div class="plate-base">
          <div class="dice-layer">
            <div class="scene"><div class="cube" id="cube-1">
              <div class="cube-face face-1"><div class="dot red" style="grid-area: 2/2"></div></div>
              <div class="cube-face face-2"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-3"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-4"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-5"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-6"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/1"></div><div class="dot" style="grid-area: 2/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
            </div></div>
            <div class="scene"><div class="cube" id="cube-2">
              <div class="cube-face face-1"><div class="dot red" style="grid-area: 2/2"></div></div>
              <div class="cube-face face-2"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-3"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-4"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-5"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-6"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/1"></div><div class="dot" style="grid-area: 2/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
            </div></div>
            <div class="scene"><div class="cube" id="cube-3">
              <div class="cube-face face-1"><div class="dot red" style="grid-area: 2/2"></div></div>
              <div class="cube-face face-2"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-3"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-4"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-5"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
              <div class="cube-face face-6"><div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/1"></div><div class="dot" style="grid-area: 2/3"></div><div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div></div>
            </div></div>
          </div>
          <div class="bowl-cover" id="bowl"><div class="bowl-knob"></div></div>
        </div>
      </div>

      <div class="result-banner" id="result-banner">CHỌN CỬA - NHẬP CHIP - BẤM XÁC NHẬN</div>

      <div class="bet-sides">
        <div class="side-box side-tai" id="zone-tai">
          <div class="side-title">TÀI</div>
          <div class="side-ratio">11 - 17 (x1.98)</div>
          <div class="side-amount" id="placed-tai"></div>
        </div>
        <div class="side-box side-xiu" id="zone-xiu">
          <div class="side-title">XỈU</div>
          <div class="side-ratio">4 - 10 (x1.98)</div>
          <div class="side-amount" id="placed-xiu"></div>
        </div>
      </div>

      <div class="control-row">
        <div class="chip-rack">
          <div class="chip c-10k active" data-val="10000">10K</div>
          <div class="chip c-50k" data-val="50000">50K</div>
          <div class="chip c-100k" data-val="100000">100K</div>
          <div class="chip c-500k" data-val="500000">500K</div>
          <div class="chip c-all" data-val="all">ALL IN</div>
        </div>
        <button class="btn-confirm" id="btn-confirm">✔ XÁC NHẬN</button>
      </div>

      <div class="streak-box">
        <div class="streak-info"><span>Tỷ lệ gần đây: <strong id="ratio-text">Tài: 50% - Xỉu: 50%</strong></span></div>
        <div class="chart-container"><canvas id="trendChart" width="550" height="60"></canvas></div>
      </div>
    </main>

    <footer class="game-footer">
      <div class="history-label">LỊCH SỬ:</div>
      <div class="history-dots" id="history-dots"></div>
      <button class="btn-modal-open" id="btn-open-modal">📊 Chi Tiết</button>
    </footer>

    <!-- Modal Nạp Tiền -->
    <div class="modal-overlay" id="modal-deposit">
      <div class="modal-card" style="max-width: 320px;">
        <div class="modal-header">
          <div class="modal-title">💰 NẠP TIỀN SUNBỊP</div>
          <button class="btn-close" id="btn-close-deposit">✕</button>
        </div>
        <div class="modal-body" style="text-align: center; padding: 10px 0;">
          <input type="number" id="deposit-input" placeholder="Nhập số tiền..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; margin-bottom: 12px;">
          <div style="display: flex; gap: 6px; justify-content: center; margin-bottom: 14px;">
            <button class="btn-chip-quick" onclick="setDepositVal(100000)">+100K</button>
            <button class="btn-chip-quick" onclick="setDepositVal(500000)">+500K</button>
            <button class="btn-chip-quick" onclick="setDepositVal(1000000)">+1M</button>
          </div>
          <button class="btn-confirm" id="btn-submit-deposit" style="width: 100%; padding: 12px;">XÁC NHẬN NẠP</button>
        </div>
      </div>
    </div>

    <!-- Modal Lịch Sử -->
    <div class="modal-overlay" id="modal-hist">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">📜 LỊCH SỬ PHIÊN ĐẤU & CƯỢC</div>
          <button class="btn-close" id="btn-close-modal">✕</button>
        </div>
        <div class="modal-body">
          <table class="hist-table">
            <thead><tr><th>Phiên</th><th>Xúc Xắc</th><th>Cửa Ra</th><th>Đã Đặt</th><th>Thắng / Thua</th></tr></thead>
            <tbody id="hist-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
